name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: make install

      - name: Линтер
        run: make lint

      - name: Сборка
        run: make build

      - name: Браузер для тестов
        run: npx playwright install --with-deps chromium

      - name: Запуск приложения (make start)
        run: |
          mkdir -p tmp && make start > tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/cities > /dev/null && exit 0
            sleep 1
          done
          cat tmp/server.log
          exit 1

      - name: Browser-тесты
        run: make test
        env:
          APP_URL: http://localhost:8080

      - name: Отчёт Playwright при падении
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tmp/
          retention-days: 7
